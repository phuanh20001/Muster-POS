<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DreamyCafe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #030712;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card { text-align: center; max-width: 360px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .status { color: #9ca3af; font-size: 0.95rem; line-height: 1.5; margin-top: 1rem; }
    .error { color: #f87171; }
    .spinner {
      width: 32px; height: 32px; margin: 1.5rem auto 0;
      border: 3px solid #374151; border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .spinner.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>DreamyCafe</h1>
    <p id="status" class="status">Starting…</p>
    <div id="spinner" class="spinner"></div>
  </div>
</body>
</html>
